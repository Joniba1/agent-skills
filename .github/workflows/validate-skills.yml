name: Validate skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/validate_skills.py"
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/validate_skills.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skills.py
